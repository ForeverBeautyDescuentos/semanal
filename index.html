        // Configuración general fija (sin acceso a localStorage)
        const generalSettings = {
            pageTitle: "Forever Beauty Descuentos",
            promoBanner: "⏰ OFERTA LIMITADA | Solo hasta agotar Stock",
            dateRange: "Semana del 12 al 18 de Junio",
            whatsappNumber: "51957196122",
            whatsappMessage: "¡Hola Forever Beauty! Estoy interesad@ en el producto:\n\n*{producto}*\nPrecio: S/.{precio} ({unidades})\n\n¿Podrías darme más información? ¿Tienen envíos a mi distrito?",
            customCategories: [
                {id: "skincare", name: "Cuidado Facial", color: "#1565c0", bgColor: "#e3f2fd", borderColor: "#bbdefb"},
                {id: "makeup", name: "Maquillaje", color: "#7b1fa2", bgColor: "#f3e5f5", borderColor: "#e1bee7"},
                {id: "perfume", name: "Perfume", color: "#2e7d32", bgColor: "#e8f5e9", borderColor: "#c8e6c9"},
                {id: "hair", name: "Cuidado Capilar", color: "#ff8f00", bgColor: "#fff8e1", borderColor: "#ffecb3"}
            ]
        };

        // Función para escapar HTML
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Función para obtener el nombre de la categoría
        function getCategoryName(categoryId) {
            const category = generalSettings.customCategories.find(c => c.id === categoryId);
            return category ? category.name : categoryId;
        }

        // Función para obtener el estilo de la categoría
        function getCategoryStyle(categoryId) {
            const category = generalSettings.customCategories.find(c => c.id === categoryId);
            if (category) {
                return `background: ${category.bgColor}; color: ${category.color}; border: 1px solid ${category.borderColor};`;
            }
            return "";
        }

        // Función corregida para enviar mensaje de WhatsApp con el producto seleccionado
        function orderProduct(productName, price) {
            // Encontrar el producto completo para obtener el pricePer
            const productId = parseInt(document.querySelector(`.product-name`).closest('.product').getAttribute('data-id'));
            const product = productsData.find(p => p.id === productId);
            
            // Limpiar el nombre del producto (reemplazar <br> y saltos de línea)
            const cleanProductName = productName.replace(/<br>/g, '\n').replace(/\n/g, ' ');
            
            const message = generalSettings.whatsappMessage
                .replace("{producto}", cleanProductName)
                .replace("{precio}", price)
                .replace("{unidades}", product.pricePer || "1 unidad");
                
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${generalSettings.whatsappNumber}?text=${encodedMessage}`, '_blank');
        }

        // Configurar filtros de productos
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Remover clase active de todos los botones
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    // Agregar clase active al botón clickeado
                    this.classList.add('active');
                    
                    const filterValue = this.getAttribute('data-filter');
                    const products = document.querySelectorAll('.product');
                    
                    products.forEach(product => {
                        product.style.display = (filterValue === 'all' || 
                                              product.getAttribute('data-category') === filterValue) 
                                              ? 'block' : 'none';
                    });
                });
            });
        }

        // Función para cargar productos iniciales
        function loadInitialProducts() {
            const productGrid = document.getElementById("productGrid");
            productGrid.innerHTML = "";
            
            // Filtrar solo productos visibles
            const visibleProducts = productsData.filter(product => product.visible);
            
            visibleProducts.forEach(product => {
                const productElement = document.createElement("div");
                productElement.className = "product";
                productElement.setAttribute("data-category", product.category);
                productElement.setAttribute("data-id", product.id);
                productElement.innerHTML = `
                    <div class="product-number">${product.id}</div>
                    ${product.soldOut ? '<span class="sold-out-badge">AGOTADO</span>' : ''}
                    <span class="sales-badge">${escapeHtml(product.badge)}</span>
                    <div class="product-image-container">
                        <img class="product-image" src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}" onclick="orderProduct('${escapeHtml(product.name.replace(/\n/g, ' '))}', '${escapeHtml(product.price)}')">
                        <img class="watermark" src="logo.jpg" alt="Forever Beauty">
                    </div>
                    <div class="product-name">${escapeHtml(product.name).replace(/\n/g, '<br>')}</div>
                    <span class="product-category" style="${getCategoryStyle(product.category)}">${getCategoryName(product.category)}</span>
                    <div class="product-price">
                        <span class="price-symbol">S/.</span>${escapeHtml(product.price)}
                        <span class="old-price">S/. ${escapeHtml(product.oldPrice)}</span>
                        ${product.pricePer ? `<div class="price-per-unit">${escapeHtml(product.pricePer)}</div>` : ''}
                    </div>
                    
                    <div class="product-buttons">
                        <button class="quick-order" onclick="orderProduct('${escapeHtml(product.name.replace(/\n/g, ' '))}', '${escapeHtml(product.price)}')">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
                            Pedir por WhatsApp
                        </button>
                    </div>
                `;
                productGrid.appendChild(productElement);
            });
        }

        // Inicialización cuando el DOM está listo
        document.addEventListener('DOMContentLoaded', function() {
            // Aplicar configuración general
            document.getElementById("mainTitle").textContent = generalSettings.pageTitle;
            document.getElementById("promoBannerElement").innerHTML = generalSettings.promoBanner.replace("OFERTA", "<strong>OFERTA</strong>");
            document.getElementById("dateRangeText").textContent = generalSettings.dateRange;
            
            // Actualizar el enlace de WhatsApp flotante
            const whatsappFloat = document.getElementById("whatsappFloat");
            whatsappFloat.href = `https://wa.me/${generalSettings.whatsappNumber}?text=${encodeURIComponent("¡Hola! Quiero aprovechar los descuentos de Forever Beauty")}`;
            
            // Cargar productos
            loadInitialProducts();
            setupFilters();
        });
